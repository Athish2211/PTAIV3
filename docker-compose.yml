services:
  # ── PostgreSQL with pgvector ─────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ptai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptai_db}
      POSTGRES_USER: ${POSTGRES_USER:-ptai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptai_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptai_user} -d ${POSTGRES_DB:-ptai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ptai_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ptai_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-ptai_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Local SLM) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ptai_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # GPU support (uncomment if you have NVIDIA GPU):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ptai_user}:${POSTGRES_PASSWORD:-ptai_secret}@postgres:5432/${POSTGRES_DB:-ptai_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-ptai_user}:${POSTGRES_PASSWORD:-ptai_secret}@postgres:5432/${POSTGRES_DB:-ptai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ptai_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-jwt-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-in-production-refresh-secret}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-session-secret}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-change-me-in-production-mfa-key}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=phi4-mini:latest
      - FAST_MODEL=phi4-mini:latest
      - QUALITY_MODEL=phi4-mini:latest
      - EMBEDDING_MODEL=nomic-embed-text
      - VECTOR_DIMENSION=768
      - MAX_UPLOAD_MB=50
      - MAX_DATASET_MB=100
      - CORS_ORIGINS=http://localhost:3000
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Background Worker ────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptai_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ptai_user}:${POSTGRES_PASSWORD:-ptai_secret}@postgres:5432/${POSTGRES_DB:-ptai_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-ptai_user}:${POSTGRES_PASSWORD:-ptai_secret}@postgres:5432/${POSTGRES_DB:-ptai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ptai_redis_secret}@redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=phi4-mini:latest
      - EMBEDDING_MODEL=nomic-embed-text
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: python -m app.workers.main

  # ── Frontend (Next.js) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ptai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=PTAI v3
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  uploads_data:
